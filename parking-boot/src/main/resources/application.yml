# =============================================================================
# 智慧停车 SaaS 平台 — 通用配置（所有 Profile 共享）
# =============================================================================
# 敏感配置（密钥、商户号、回调地址等）禁止写入此文件。
# 生产环境所有敏感值通过环境变量注入，本地开发使用 application-local.yml。
# =============================================================================

spring:
  application:
    name: jushan-platform
  profiles:
    active: local

  # ---- Web MVC ----
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  # ---- 数据源（默认 local 环境使用本地 MySQL，生产/测试由对应 profile 覆盖） ----
  datasource:
    url: jdbc:mysql://localhost:3306/jushan_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

  # ---- Redis（local 环境默认连接本地） ----
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# ---- 服务端口 ----
server:
  port: 8080
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

# ---- Actuator 健康检查与监控 ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.9,0.99

# ---- Device Access 客户端（T23, 任务包 7-1 增强） ----
# 生产环境通过环境变量覆盖：JUSHAN_DEVICE_ACCESS_BASE_URL / CONNECT_TIMEOUT / READ_TIMEOUT
jushan:
  device-access:
    base-url: http://localhost:8082
    connect-timeout: 3000
    read-timeout: 12000
    api-key: ${JUSHAN_DEVICE_ACCESS_API_KEY:}
    # ---- 写命令幂等重试（仅 openGate/closeGate） ----
    retry:
      max-attempts: 3
      intervals: 1000,5000,30000
    # ---- Mock 适配器（默认关闭，local/test 环境覆盖为 true） ----
    mock:
      enabled: false
    # ---- 白名单同步 API Key（Adapter→Platform 内部通信鉴权） ----
    whitelist-sync-api-key: ""

# ---- 模拟支付（Phase 0 S0-3） ----
# 生产环境强制启用模拟支付，禁止连接任何第三方支付平台（4pyun.com 等）。
mock-payment:
  enabled: true

# ---- P云支付（已废弃——永远为 true，禁止连接真实支付平台） ----
pyun:
  mock: true

# ---- Device Access Webhook 接收端配置 ----
# 生产环境必须通过环境变量覆盖：DEVICE_ACCESS_WEBHOOK_ALLOWED_IPS
# 所有环境必须配置 webhook 签名密钥（webhook_secret 表），否则请求被拒绝
device-access:
  webhook:
    # IP 白名单（逗号分隔），默认空表示不启用 IP 过滤
    # 生产环境必须配置为 Device Access 服务的具体 IP 地址
    # 禁止使用 *（全放行），仅测试可按需启用
    allowed-ips: "127.0.0.1"
    # 签名校验（HMAC-SHA256），默认启用。仅 dev 环境可关闭用于调试
    signature-enabled: true
    # 时间戳容忍偏差（秒），默认 300 秒（5 分钟）
    timestamp-tolerance-seconds: 300

# ---- JWT 配置 ----
# 生产环境必须通过环境变量 JWT_SECRET 注入（至少 32 字符，无默认值，缺失即拒绝启动）
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # access token 有效期 24 小时（毫秒）
  refresh-expiration: 604800000 # refresh token 有效期 7 天（毫秒）

# ---- 微信小程序配置 ----
# appid/secret 通过环境变量注入，不入库、不入仓
wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
    connect-timeout: 5000
    read-timeout: 10000
    subscribe-template-id: ${WX_SUBSCRIBE_TEMPLATE_ID:}
  mock-login: false

# ---- springdoc-openapi 文档 ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.jushan.platform.modules,com.jushan.system
  default-flat-param-object: true

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.jushan: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"

# ---- H5 车主端配置 ----
h5:
  mock-pay-enabled: true
  callback-url: http://localhost:3002/pay/result
